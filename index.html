<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수행평가">
<meta name="theme-color" content="#f5f3ff">
<title>수행평가 노트</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:      #f5f3ff;
  --bg2:     #eee9ff;
  --white:   #ffffff;
  --card:    #ffffffcc;

  --lavender: #c4b5fd;
  --violet:   #8b5cf6;
  --violet-l: #ede9fe;
  --violet-m: #ddd6fe;

  --rose:     #fda4af;
  --rose-l:   #fff1f2;
  --rose-m:   #ffe4e6;

  --sky:      #7dd3fc;
  --sky-l:    #f0f9ff;
  --sky-m:    #e0f2fe;

  --mint:     #6ee7b7;
  --mint-l:   #f0fdf4;
  --mint-m:   #d1fae5;

  --peach:    #fdba74;
  --peach-l:  #fff7ed;
  --peach-m:  #fed7aa;

  --lemon:    #fde68a;
  --lemon-l:  #fefce8;

  --t1:   #3b3256;
  --t2:   #7c6fa0;
  --t3:   #b0a3cc;
  --t4:   #d4cce8;

  --shadow-sm: 0 2px 8px rgba(139,92,246,.08);
  --shadow:    0 4px 20px rgba(139,92,246,.12);
  --shadow-lg: 0 8px 40px rgba(139,92,246,.18);
}

body{
  font-family:'Pretendard','Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--t1);
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  font-size:14px;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ══ TOPBAR ══ */
.topbar{
  height:56px;
  background:var(--white);
  border-bottom:1px solid var(--violet-m);
  display:flex;
  align-items:center;
  padding:0 28px;
  gap:14px;
  flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.logo{
  font-size:15px;font-weight:800;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:.5px;
}
.breadcrumb{
  display:flex;align-items:center;gap:6px;
  font-size:12.5px;color:var(--t3);
}
.breadcrumb .bc-sep{color:var(--t4)}
.breadcrumb .bc-item{cursor:pointer;transition:color .15s;font-weight:500}
.breadcrumb .bc-item:hover{color:var(--violet)}
.breadcrumb .bc-item.cur{color:var(--t1);font-weight:700;cursor:default}
.sp{flex:1}
.top-btns{display:flex;gap:8px}
.tbtn{
  padding:7px 14px;border-radius:20px;
  border:1.5px solid var(--violet-m);
  background:transparent;color:var(--t2);
  font-size:12px;font-family:inherit;cursor:pointer;
  transition:all .18s;font-weight:600;
}
.tbtn:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-l)}
.tbtn.primary{
  background:linear-gradient(135deg,#8b5cf6,#a78bfa);
  border-color:transparent;color:#fff;
}
.tbtn.primary:hover{opacity:.88;transform:translateY(-1px)}

/* ══ SCREEN CONTAINER ══ */
.screens{flex:1;overflow:hidden;position:relative}
.screen{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  overflow:hidden;
}
.screen.active{display:flex}

/* ══ PAGE: 과목 선택 ══ */
#pg-subjects{
  align-items:center;
  justify-content:center;
  background:var(--bg);
  padding:40px;
  gap:0;
}
.pg-title{
  font-size:13px;font-weight:700;
  color:var(--t3);letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:10px;
  text-align:center;
}
.pg-heading{
  font-size:28px;font-weight:800;
  color:var(--t1);
  text-align:center;
  margin-bottom:6px;
}
.pg-sub{
  font-size:13.5px;color:var(--t2);
  text-align:center;
  margin-bottom:40px;
}

.subjects-grid{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  justify-content:center;
  max-width:820px;
}
.subject-card{
  width:160px;
  aspect-ratio:1/1.1;
  border-radius:22px;
  border:2px solid transparent;
  background:var(--white);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  transition:all .22s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  overflow:hidden;
}
.subject-card::before{
  content:'';
  position:absolute;inset:0;
  opacity:0;
  transition:opacity .2s;
  border-radius:20px;
}
.subject-card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:var(--shadow-lg);
}
.subject-card:hover::before{opacity:1}
.subject-card .sc-icon{font-size:36px;position:relative}
.subject-card .sc-name{
  font-size:13.5px;font-weight:700;
  color:var(--t1);position:relative;
}
.subject-card .sc-count{
  font-size:11px;color:var(--t2);position:relative;
}
.add-subject-card{
  width:160px;aspect-ratio:1/1.1;
  border-radius:22px;
  border:2px dashed var(--t4);
  background:transparent;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;cursor:pointer;
  transition:all .18s;color:var(--t3);
  font-family:inherit;
}
.add-subject-card:hover{
  border-color:var(--violet);color:var(--violet);
  background:var(--violet-l);
}
.add-subject-card .plus{font-size:28px}
.add-subject-card span{font-size:12.5px;font-weight:600}

/* 과목별 색상 */
.sc-bio{background:linear-gradient(135deg,#f0fdf4,#dcfce7)!important}
.sc-bio::before{background:linear-gradient(135deg,rgba(110,231,183,.3),rgba(52,211,153,.1))}
.sc-bio:hover{border-color:var(--mint)!important}
.sc-phys{background:linear-gradient(135deg,#f0f9ff,#dbeafe)!important}
.sc-phys::before{background:linear-gradient(135deg,rgba(125,211,252,.3),rgba(96,165,250,.1))}
.sc-phys:hover{border-color:var(--sky)!important}
.sc-chem{background:linear-gradient(135deg,#fff7ed,#ffedd5)!important}
.sc-chem::before{background:linear-gradient(135deg,rgba(253,186,116,.3),rgba(251,146,60,.1))}
.sc-chem:hover{border-color:var(--peach)!important}
.sc-earth{background:linear-gradient(135deg,#eff6ff,#dbeafe)!important}
.sc-earth:hover{border-color:#93c5fd!important}
.sc-math{background:linear-gradient(135deg,#fdf4ff,#fae8ff)!important}
.sc-math::before{background:linear-gradient(135deg,rgba(196,181,253,.3),rgba(167,139,250,.1))}
.sc-math:hover{border-color:var(--lavender)!important}
.sc-default{background:linear-gradient(135deg,#fff1f2,#ffe4e6)!important}
.sc-default:hover{border-color:var(--rose)!important}

/* ══ PAGE: 학년 선택 ══ */
#pg-grades{
  align-items:center;
  justify-content:center;
  background:var(--bg);
  padding:40px;
  gap:0;
}
.grades-grid{
  display:flex;gap:20px;flex-wrap:wrap;
  justify-content:center;
}
.grade-card{
  width:200px;height:220px;
  border-radius:24px;
  border:2px solid var(--violet-m);
  background:var(--white);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:12px;cursor:pointer;
  transition:all .22s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.grade-card:hover{
  transform:translateY(-6px) scale(1.04);
  border-color:var(--violet);
  box-shadow:var(--shadow-lg);
  background:var(--violet-l);
}
.grade-card .gc-num{
  font-size:52px;font-weight:800;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.grade-card .gc-label{font-size:14px;font-weight:700;color:var(--t1)}
.grade-card .gc-count{font-size:11.5px;color:var(--t2)}

/* ══ PAGE: 수행평가 선택 ══ */
#pg-perfs{
  align-items:center;
  justify-content:center;
  background:var(--bg);
  padding:40px;
  gap:0;
}
.perfs-wrap{
  display:flex;flex-direction:column;gap:0;
  width:100%;max-width:680px;
}
.perfs-header{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.perfs-header h2{font-size:16px;font-weight:800;color:var(--t1)}
.perf-list{display:flex;flex-direction:column;gap:10px}
.perf-item{
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;
  background:var(--white);
  border:2px solid var(--violet-m);
  border-radius:16px;
  cursor:pointer;
  transition:all .2s;
  box-shadow:var(--shadow-sm);
}
.perf-item:hover{
  border-color:var(--violet);
  transform:translateX(6px);
  box-shadow:var(--shadow);
}
.pi-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pi-info{flex:1}
.pi-name{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:3px}
.pi-meta{font-size:11.5px;color:var(--t2)}
.pi-score{
  font-size:13px;font-weight:800;
  padding:4px 12px;border-radius:12px;
  font-family:'JetBrains Mono',monospace;
}
.pi-arr{font-size:16px;color:var(--t3);transition:transform .2s}
.perf-item:hover .pi-arr{transform:translateX(4px);color:var(--violet)}
.pi-del{
  font-size:12px;color:var(--t3);cursor:pointer;
  padding:4px 7px;border-radius:8px;
  transition:all .1s;opacity:0;
}
.perf-item:hover .pi-del{opacity:1}
.pi-del:hover{color:var(--rose);background:var(--rose-m)}
.pi-edit{
  font-size:13px;color:var(--t3);cursor:pointer;
  padding:4px 7px;border-radius:8px;
  transition:all .1s;opacity:0;
}
.perf-item:hover .pi-edit{opacity:1}
.pi-edit:hover{color:var(--violet);background:var(--violet-l)}

.add-perf-btn{
  display:flex;align-items:center;justify-content:center;
  gap:8px;padding:14px;
  background:transparent;
  border:2px dashed var(--t4);
  border-radius:16px;
  color:var(--t3);
  font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;
  transition:all .18s;margin-top:4px;
}
.add-perf-btn:hover{
  border-color:var(--violet);color:var(--violet);background:var(--violet-l)
}

/* 탭 (수행평가/성적) */
.view-toggle{
  display:flex;gap:6px;
  background:var(--violet-l);
  border-radius:12px;
  padding:4px;
  margin-bottom:20px;
}
.vt-btn{
  flex:1;padding:8px;border-radius:9px;
  border:none;background:transparent;
  font-size:12.5px;font-weight:700;
  color:var(--t2);font-family:inherit;cursor:pointer;
  transition:all .2s;
}
.vt-btn.active{
  background:var(--white);color:var(--violet);
  box-shadow:var(--shadow-sm);
}

/* ══ PAGE: 수행평가 상세 ══ */
#pg-detail{
  background:var(--bg);
  overflow:hidden;
}
.detail-layout{
  display:flex;
  height:100%;
  overflow:hidden;
}

/* 왼쪽 섹션 목록 */
.detail-sidebar{
  width:240px;
  flex-shrink:0;
  background:var(--white);
  border-right:1px solid var(--violet-m);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.ds-header{
  padding:20px 16px 12px;
  border-bottom:1px solid var(--violet-m);
  flex-shrink:0;
}
.ds-perf-name{
  font-size:14px;font-weight:800;
  color:var(--t1);margin-bottom:3px;
  line-height:1.3;
}
.ds-meta{font-size:11px;color:var(--t2)}
.ds-score-row{
  display:flex;align-items:center;gap:6px;
  margin-top:8px;
}
.ds-score{
  font-size:18px;font-weight:800;
  font-family:'JetBrains Mono',monospace;
  color:var(--violet);
}
.ds-score-label{font-size:10.5px;color:var(--t2)}
.ds-list{flex:1;overflow-y:auto;padding:8px}
.ds-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:10px;
  cursor:pointer;transition:all .15s;
  margin-bottom:2px;
}
.ds-item:hover{background:var(--violet-l)}
.ds-item.active{
  background:linear-gradient(135deg,var(--violet-l),var(--violet-m));
  color:var(--violet);
}
.ds-item .di-icon{font-size:13px;flex-shrink:0}
.ds-item .di-label{
  font-size:12.5px;font-weight:600;
  color:var(--t2);flex:1;
}
.ds-item.active .di-label{color:var(--violet)}
.ds-item .di-pill{
  font-size:9.5px;font-weight:700;
  padding:1px 6px;border-radius:8px;
}
.dp-ok{background:var(--mint-m);color:#059669}
.dp-no{background:var(--t4);color:var(--t3)}
.ds-item .di-del{
  font-size:10px;color:var(--t4);cursor:pointer;
  padding:2px 5px;border-radius:5px;
  transition:all .1s;opacity:0;margin-left:2px;
}
.ds-item:hover .di-del{opacity:1}
.di-del:hover{color:var(--rose)!important;background:var(--rose-m)}
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:10px;
  border:1.5px dashed var(--t4);
  background:transparent;color:var(--t3);
  font-size:12px;font-family:inherit;cursor:pointer;
  transition:all .15s;width:100%;margin-top:4px;
}
.ds-add-btn:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-l)}

/* 오른쪽 에디터 */
.detail-editor{
  flex:1;
  display:flex;flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}
.de-toolbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 24px;
  background:var(--white);
  border-bottom:1px solid var(--violet-m);
  flex-shrink:0;
}
.de-section-title{
  font-size:14px;font-weight:800;color:var(--t1);
  display:flex;align-items:center;gap:8px;
}
.de-sp{flex:1}
.de-btn{
  padding:6px 14px;border-radius:10px;
  border:1.5px solid var(--violet-m);
  background:transparent;color:var(--t2);
  font-size:12px;font-family:inherit;cursor:pointer;
  transition:all .15s;font-weight:600;
}
.de-btn:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-l)}
.de-btn.ask{
  background:linear-gradient(135deg,#8b5cf6,#a78bfa);
  border-color:transparent;color:#fff;
}
.de-btn.ask:hover{opacity:.88}

.de-body{
  flex:1;overflow-y:auto;
  padding:24px;
}
.editor-area{
  background:var(--white);
  border:2px solid var(--violet-m);
  border-radius:18px;
  min-height:300px;
  padding:22px 26px;
  font-size:13.5px;line-height:1.9;
  color:var(--t1);
  outline:none;
  white-space:pre-wrap;
  font-family:'Pretendard',sans-serif;
  transition:border .2s;
  box-shadow:var(--shadow-sm);
}
.editor-area:focus{border-color:var(--violet);box-shadow:var(--shadow)}
.editor-area:empty::before{
  content:attr(data-ph);
  color:var(--t3);font-style:italic;
}

/* AI 패널 */
.ai-panel{
  background:var(--white);
  border:2px solid var(--violet-m);
  border-radius:18px;
  overflow:hidden;
  margin-top:14px;
  box-shadow:var(--shadow-sm);
}
.ai-header{
  display:flex;align-items:center;gap:8px;
  padding:12px 18px;
  background:linear-gradient(135deg,var(--violet-l),var(--violet-m));
  border-bottom:1px solid var(--violet-m);
}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--violet);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.ai-title{font-size:12.5px;font-weight:700;color:var(--violet)}
.ai-body{padding:14px 18px}
.ai-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{
  padding:5px 12px;border-radius:20px;
  border:1.5px solid var(--violet-m);
  background:transparent;color:var(--t2);
  font-size:11.5px;font-family:inherit;cursor:pointer;
  transition:all .15s;font-weight:600;
}
.chip:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-l)}
.ai-input-row{display:flex;gap:8px}
.ai-in{
  flex:1;background:var(--bg);
  border:1.5px solid var(--violet-m);
  border-radius:12px;
  color:var(--t1);padding:9px 14px;
  font-size:13px;font-family:inherit;
  outline:none;resize:none;transition:border .15s;
}
.ai-in:focus{border-color:var(--violet)}
.ai-send{
  padding:9px 18px;border-radius:12px;
  border:none;
  background:linear-gradient(135deg,#8b5cf6,#a78bfa);
  color:#fff;font-size:12.5px;
  font-family:inherit;cursor:pointer;
  transition:opacity .15s;font-weight:700;
  white-space:nowrap;
}
.ai-send:hover{opacity:.88}
.ai-send:disabled{opacity:.4;cursor:not-allowed}
.ai-result{
  margin-top:10px;
  padding:12px 14px;
  background:var(--violet-l);
  border-radius:10px;
  font-size:12.5px;color:var(--t1);
  line-height:1.7;
  white-space:pre-wrap;
}
.typing{display:flex;gap:4px;align-items:center}
.typing span{
  width:6px;height:6px;background:var(--violet);
  border-radius:50%;animation:bounce .8s infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* 점수·파일 패널 */
.meta-panel{
  display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;
}
.meta-box{
  flex:1;min-width:130px;
  background:var(--white);
  border:2px solid var(--violet-m);
  border-radius:14px;
  padding:14px 16px;
  box-shadow:var(--shadow-sm);
}
.mb-label{
  font-size:10px;font-weight:700;
  color:var(--t3);letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:6px;
}
.mb-input{
  font-size:22px;font-weight:800;
  font-family:'JetBrains Mono',monospace;
  color:var(--t1);
  background:transparent;border:none;outline:none;
  width:100%;
}
.mb-input::placeholder{color:var(--t4);font-weight:400;font-size:18px}
.mb-suffix{font-size:11px;color:var(--t3);margin-top:2px}

.file-zone{
  flex:1.5;min-width:160px;
  background:var(--white);
  border:2px dashed var(--violet-m);
  border-radius:14px;
  padding:14px 16px;
  text-align:center;
  transition:all .2s;
  box-shadow:var(--shadow-sm);
}
.file-zone:hover,.file-zone.drag{border-color:var(--violet);background:var(--violet-l)}
.file-zone input{display:none}
.fz-icon{font-size:20px;margin-bottom:4px}
.fz-txt{font-size:12px;color:var(--t2);font-weight:600}
.fz-btns{display:flex;gap:6px;justify-content:center;margin-top:8px}
.fz-action-btn{
  padding:5px 11px;border-radius:8px;
  border:1.5px solid var(--violet-m);
  background:transparent;color:var(--t2);
  font-size:11.5px;font-family:inherit;cursor:pointer;
  transition:all .15s;font-weight:600;
}
.fz-action-btn:hover{border-color:var(--violet);color:var(--violet);background:var(--violet-l)}

/* 완성하기 버튼 */
.complete-btn{
  display:flex;align-items:center;gap:6px;
  width:100%;padding:11px;
  border-radius:12px;
  border:2px solid var(--mint);
  background:var(--mint-l);
  color:#059669;
  font-size:13px;font-weight:700;
  font-family:inherit;cursor:pointer;
  transition:all .2s;margin-top:10px;
  justify-content:center;
}
.complete-btn:hover{background:var(--mint-m);transform:translateY(-1px);box-shadow:var(--shadow-sm)}

<script>

const STORAGE_KEY = 'sciapp_data';
const GRADES = ['1학년','2학년','3학년'];
const SUBJECT_STYLES = {
  '🧬':['sc-bio','#10b981'],

  '🌐':['sc-default','#06b6d4'],
  '📖':['sc-default','#8b5cf6'],
  '🎨':['sc-default','#f43f5e'],
  '🏃':['sc-default','#f59e0b'],
};

function mkGrades(){const o={};GRADES.forEach(g=>{o[g]={perfs:[]}});return o}
function mkExams(){const o={};GRADES.forEach(g=>{o[g]={exams:[]}});return o}

const ORDOVICIAN_PERF = {
  id:'p1',name:'오르도비스기 대멸종 발표',
  type:'🎤 발표',color:'#22c55e',
  score:'',maxScore:'100',rank:'',files:[],
  sections:[
    {id:'s_ov',icon:'📋',label:'개요',open:true,content:`약 4억 4,500만 년 전 고생대 오르도비스기 말(히르난트절)에 발생한 대규모 멸종.

학술명: LOME (Late Ordovician Mass Extinction)
• 해양 생물 종의 약 85% 멸종
• 동물상 속의 49%, 과의 26% 소멸
• 5대 대멸종(Big Five) 중 첫 번째, 규모 2위
• 두 차례 펄스(LOME-I, LOME-II)로 진행`},
    {id:'s_env',icon:'🌏',label:'시대 환경',open:false,content:`【 시기 】
약 4억 8,540만 년 전 ~ 4억 4,380만 년 전 (약 4,160만 년 지속)
캄브리아기 다음, 실루리아기 이전. 고생대 6개 기(期) 중 두 번째.

【 기후 】
초중반 (트레마독절~카티안절): 초온실 기후

const SB_HEADERS = { 'Content-Type':'application/json', 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY };
const DB_KEY = 'main_data';

let D = defaultData();
let storageReady = false;
let syncTimer = null;

function setSyncStatus(status){
  const el = document.getElementById('sync-status');
  if(!el) return;
  const map = {
    syncing: ['🔄','동기화 중...','var(--t3)'],
    ok:      ['☁️','저장됨','var(--grn,#2ecc87)'],
    offline: ['💾','로컬 저장','var(--t3)'],
    error:   ['⚠️','동기화 실패','var(--peach,#f59e0b)'],
  };
  const [icon, txt, color] = map[status] || map.offline;
  el.innerHTML = `<span>${icon}</span> ${txt}`;
  el.style.color = color;
}

async function sbGet(){
  const r = await fetch(`${SB_URL}/rest/v1/app_data?key=eq.${DB_KEY}&select=value`, { headers: SB_HEADERS });
  if(!r.ok) throw new Error('fetch failed');
  const rows = await r.json();
  return rows[0]?.value || null;
}

async function sbSet(val){
  const r = await fetch(`${SB_URL}/rest/v1/app_data`, {
    method: 'POST',
    headers: { ...SB_HEADERS, 'Prefer':'resolution=merge-duplicates' },
    body: JSON.stringify({ key: DB_KEY, value: val })
  });
  if(!r.ok) throw new Error('upsert failed');
}

async function initStorage(){
  // 1) 로컬 먼저 로드해서 일단 화면 그리기
  try {
    const local = localStorage.getItem(STORAGE_KEY);
    if(local){
      const parsed = JSON.parse(local);
      mergeDefaults(parsed);
      D = parsed;
    }
  } catch(e){}
  storageReady = true;
  renderSubjects();
  setSyncStatus('syncing');

  // 2) Supabase에서 최신 데이터 가져오기
  try {
    const remote = await sbGet();
    if(remote){
      const parsed = JSON.parse(remote);
      mergeDefaults(parsed);
      D = parsed;
      localStorage.setItem(STORAGE_KEY, remote);
      renderSubjects();
      setSyncStatus('ok');
    } else {
      // 첫 기기 — 로컬 데이터 올리기
      await sbSet(JSON.stringify(D));
      setSyncStatus('ok');
    }
  } catch(e){
    // Claude 아티팩트 환경 등 외부 차단 시 조용히 로컬 모드로
    setSyncStatus('offline');
  }
}

function mergeDefaults(parsed){
  const existingIds = parsed.subjects.map(s=>s.id);
  defaultData().subjects.forEach(ds=>{
    if(!existingIds.includes(ds.id)) parsed.subjects.push(ds);
  });
}

function save(){
  // 로컬 즉시 저장
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(D)); } catch(e){}
  // Supabase는 디바운스 (1.5초 후 한 번만)
  clearTimeout(syncTimer);
  setSyncStatus('syncing');
  syncTimer = setTimeout(async ()=>{
    try {
      await sbSet(JSON.stringify(D));
      setSyncStatus('ok');
    } catch(e){
      setSyncStatus('offline');
    }
  }, 1500);
}

async function callAI(system, userMsg) {
  const resp = await fetch(`${AI_ENDPOINT}?key=${GEMINI_KEY}`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      system_instruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts: [{ text: userMsg }] }],
      generationConfig: { maxOutputTokens: 1500 }
    })
  });
  const data = await resp.json();
  if (!resp.ok || data.error) throw new Error(data.error?.message || JSON.stringify(data).slice(0,200));

function goPage(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('pg-'+id).classList.add('active');
  updateBreadcrumb();
}

function updateBreadcrumb(){
  const bc=document.getElementById('breadcrumb');
  const parts=[];
  if(curSubId){const s=findSub(curSubId);parts.push({label:s.icon+' '+s.name,action:()=>backToSubjects()})}
  if(curGrade)parts.push({label:curGrade,action:()=>backToGrades()});
  if(curPerfId){const p=curPerf();parts.push({label:p.name,action:()=>backToPerfs()})}
  if(curSecId){const s=curSec();parts.push({label:s.label,action:null})}

  bc.innerHTML='';
  parts.forEach((p,i)=>{
    if(i>0){const sep=document.createElement('span');sep.className='bc-sep';sep.textContent='›';bc.appendChild(sep)}
    const span=document.createElement('span');
    span.className='bc-item'+(i===parts.length-1?' cur':'');
    span.textContent=p.label;
    if(p.action)span.onclick=p.action;
    bc.appendChild(span);
  });
}

function renderPerfList(body){
  const sub=findSub(curSubId);
  const perfs=sub.grades[curGrade]?.perfs||[];

  const hdr=document.createElement('div');
  hdr.className='perfs-header';
  hdr.innerHTML=`<h2>${sub.icon} ${sub.name} · ${curGrade} 수행평가</h2>`;
  const addBtn=document.createElement('button');
  addBtn.className='tbtn primary';addBtn.textContent='+ 추가';
  addBtn.onclick=()=>{addingToSub=curSubId;openM('m-perf')};
  hdr.appendChild(addBtn);
  body.appendChild(hdr);

  if(!perfs.length){
    body.innerHTML+=`<div style="text-align:center;padding:40px 0;color:var(--t3);font-size:13px">수행평가가 없어요.<br><button class="add-perf-btn" style="margin:14px auto 0;display:flex" onclick="addingToSub=curSubId;openM('m-perf')">+ 수행평가 추가</button></div>`;
    return;
  }

  const list=document.createElement('div');list.className='perf-list';
  perfs.forEach(p=>{
    const pct=p.score&&p.maxScore?parseInt(p.score)/parseInt(p.maxScore):null;
    const scoreColor=pct===null?'var(--t3)':pct>=.8?'#059669':pct>=.6?'#d97706':'#dc2626';
    const scoreBg=pct===null?'var(--t4)':pct>=.8?'var(--mint-m)':pct>=.6?'var(--lemon)':'var(--rose-m)';
    const scoreText=p.score?`${p.score}/${p.maxScore}`:'미입력';
    const item=document.createElement('div');
    item.className='perf-item';
    item.innerHTML=`
      <span class="pi-dot" style="background:${p.color}"></span>
      <div class="pi-info">
        <div class="pi-name">${p.name}</div>
        <div class="pi-meta">${p.type} · ${curGrade}</div>
      </div>
      <span class="pi-score" style="color:${scoreColor};background:${scoreBg}">${scoreText}</span>
      <span class="pi-edit" onclick="openEditPerf('${p.id}',event)" title="편집">✎</span>
      <span class="pi-del" onclick="delPerf('${p.id}',event)">✕</span>
      <span class="pi-arr">→</span>`;
    item.onclick=(e)=>{if(e.target.classList.contains('pi-del'))return;openPerf(p.id)};
    list.appendChild(item);
  });

  const addItem=document.createElement('button');
  addItem.className='add-perf-btn';
  addItem.innerHTML='＋ 수행평가 추가';
  addItem.onclick=()=>{addingToSub=curSubId;openM('m-perf')};
  list.appendChild(addItem);
  body.appendChild(list);
}

function renderExamList(body){

    const item=document.createElement('div');item.className='exam-item';
    item.innerHTML=`

  p.sections = p.sections.filter(s => s.id !== secId);
  if(curSecId === secId) curSecId = p.sections[0]?.id || null;
  save();
  renderDetail();
}

function renderFiles(p){
  if(!(p.files||[]).length) return `<div style="font-size:11px;color:var(--t3);text-align:center;padding:6px 0">업로드된 파일 없음</div>`;
  return (p.files||[]).map((f,i)=>{
    const openable = f.content!=null || f.dataUrl!=null || FILE_BLOBS[`${p.id}_${i}`];
    const style = openable
      ? 'color:var(--violet);text-decoration:underline;text-underline-offset:2px;cursor:pointer'
      : 'color:var(--t2)';
    const click = openable ? `onclick="openFileViewer(${i})"` : '';
    return `<div class="fi-item">
      <span>${getFileIcon(f.name)}</span>
      <span class="fi-name" style="${style}" ${click}>${f.name}</span>
      <span class="fi-del" onclick="delFile(${i},event)">✕</span>
    </div>`;
  }).join('');
}

function getFileIcon(name){
  const ext=(name.split('.').pop()||'').toLowerCase();
  return {pdf:'📕',hwp:'📝',hwpx:'📝',doc:'📘',docx:'📘',ppt:'📙',pptx:'📙',xls:'📗',xlsx:'📗',txt:'📄',md:'📄',png:'🖼',jpg:'🖼',jpeg:'🖼',gif:'🖼',webp:'🖼'}[ext]||'📎';
}

function openFileViewer(idx){
  const p=curPerf();if(!p)return;
  const f=p.files[idx];if(!f)return;
  const ext=(f.name.split('.').pop()||'').toLowerCase();

  // HWP/HWPX → 한컴독스 뷰어로 열기
  if(ext==='hwp'||ext==='hwpx'){
    if(f.dataUrl){
      const byteStr=atob(f.dataUrl.split(',')[1]);
      const bytes=new Uint8Array(byteStr.length);
      for(let i=0;i<byteStr.length;i++)bytes[i]=byteStr.charCodeAt(i);
      const blob=new Blob([bytes],{type:'application/x-hwp'});
      const url=URL.createObjectURL(blob);
      window.open(url,'_blank');
    } else {
      alert('파일을 다시 업로드해주세요.');
    }
    return;
  }

  // PDF → 새 탭에서 열기
  if(ext==='pdf'){
    if(f.dataUrl){
      const byteStr=atob(f.dataUrl.split(',')[1]);
      const bytes=new Uint8Array(byteStr.length);
      for(let i=0;i<byteStr.length;i++)bytes[i]=byteStr.charCodeAt(i);
      const blob=new Blob([bytes],{type:'application/pdf'});
      window.open(URL.createObjectURL(blob),'_blank');
    } else { alert('PDF를 다시 업로드해주세요.'); }
    return;
  }

  // 이미지 → 앱 안 모달
  if(f.dataUrl&&['png','jpg','jpeg','gif','webp'].includes(ext)){
    const ov=document.createElement('div');
    ov.className='overlay open';ov.style.zIndex='2000';
    ov.innerHTML=`<div class="modal" style="max-width:700px;max-height:90vh;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0">
        <h3>${getFileIcon(f.name)} ${f.name}</h3>
        <button class="xbtn" onclick="this.closest('.overlay').remove()">✕</button>
      </div>
      <div style="flex:1;overflow:auto;text-align:center">
        <img src="${f.dataUrl}" style="max-width:100%;border-radius:10px;display:block;margin:auto">
      </div></div>`;
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
    document.body.appendChild(ov);
    return;
  }

  // 텍스트 → 앱 안 모달
  if(f.content!=null){
    const ov=document.createElement('div');
    ov.className='overlay open';ov.style.zIndex='2000';
    ov.innerHTML=`<div class="modal" style="max-width:660px;max-height:88vh;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0">
        <h3>${getFileIcon(f.name)} ${f.name}</h3>
        <button class="xbtn" onclick="this.closest('.overlay').remove()">✕</button>
      </div>
      <div style="flex:1;overflow-y:auto;background:var(--bg);border:1px solid var(--violet-m);border-radius:10px;padding:16px;font-size:13px;line-height:1.9;color:var(--t1);white-space:pre-wrap;font-family:'JetBrains Mono',monospace">${esc(f.content)}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button class="mb" onclick="insertFileToSec(${idx});this.closest('.overlay').remove()">📂 섹션에 추가</button>
        <button class="mb p" onclick="this.closest('.overlay').remove()">닫기</button>
      </div></div>`;
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove()});
    document.body.appendChild(ov);
    return;
  }

  alert(`"${f.name}"\n\n이 파일은 브라우저에서 직접 열 수 없어요.`);
}

  sec.content = add;
  save();

  if(ed) ed.innerText = sec.content;

}

async function askAI(preset){
  const inp=document.getElementById('ai-in');
  const sendBtn=document.getElementById('ai-send');
  const resultEl=document.getElementById('ai-result');
  if(!resultEl)return;

  const msg=preset||(inp?.value?.trim());
  if(!msg)return;
  if(inp)inp.value='';
  if(sendBtn)sendBtn.disabled=true;

  const p=curPerf();const sec=curSec();const sub=findSub(curSubId);
  const ctx=p.sections.filter(s=>s.content?.trim()).map(s=>`[${s.label}]\n${s.content.trim().slice(0,200)}`).join('\n\n');

  resultEl.innerHTML=`<div class="ai-result"><div class="typing"><span></span><span></span><span></span></div></div>`;

  try{
    const systemPrompt = `너는 수행평가 자료를 정리해주는 AI야.
수행평가: "${p.name}" (${p.type}), 과목: ${sub.icon}${sub.name}
현재 편집 중인 섹션: [${sec.label}]
기존 내용: ${sec.content?.slice(0,300)||'없음'}
전체 맥락: ${ctx.slice(0,600)||'없음'}

요청에 맞게 [${sec.label}] 섹션 내용을 한국어로 깔끔하게 정리해줘.
마크다운 헤더(#) 없이, 줄바꿈과 bullet(•, -, ①②③)만 사용해.
내용만 바로 출력해, 설명이나 안내 없이.`;

    const text = await callAI(systemPrompt, msg);

    sec.content = text.trim();
    save();
    const ed = document.getElementById('main-editor');
    if(ed) ed.innerText = sec.content;
    renderDetailSidebar();
    resultEl.innerHTML = `<div class="ai-result">✅ <strong>[${sec.label}]</strong> 섹션에 정리했어요!</div>`;
  }catch(e){
    resultEl.innerHTML=`<div class="ai-result" style="color:#dc2626">오류: ${e.message}</div>`;
  }
  if(sendBtn)sendBtn.disabled=false;
}

// 업로드된 파일의 blob URL 임시 보관 (새로고침 시 사라짐 — File 객체 자체를 유지)
const FILE_BLOBS = {}; // key: perfId_idx → blob URL

const TEXT_EXTS = ['txt','md','csv','json','xml','html','css','js','py'];
const IMG_EXTS  = ['png','jpg','jpeg','gif','webp'];

function isTextFile(name){ return TEXT_EXTS.includes((name.split('.').pop()||'').toLowerCase()); }
function isImgFile(name){ return IMG_EXTS.includes((name.split('.').pop()||'').toLowerCase()); }
function isPdfFile(name){ return (name.split('.').pop()||'').toLowerCase()==='pdf'; }

function readFileEntry(file, p, onDone){
  const entry = { name:file.name, size:file.size, content:null, dataUrl:null };
  const ext=(file.name.split('.').pop()||'').toLowerCase();

  if(isTextFile(file.name)){
    const r=new FileReader();
    r.onload=ev=>{entry.content=ev.target.result;onDone(entry);};
    r.readAsText(file,'UTF-8');
  } else if(isImgFile(file.name)||isPdfFile(file.name)||ext==='hwp'||ext==='hwpx'||ext==='doc'||ext==='docx'||ext==='ppt'||ext==='pptx'){
    // 모든 파일을 base64로 저장 → 항상 열 수 있음
    const r=new FileReader();
    r.onload=ev=>{entry.dataUrl=ev.target.result;onDone(entry);};
    r.readAsDataURL(file);
  } else {
    onDone(entry);
  }
}

function handleFiles(e){
  const p=curPerf();if(!p)return;
  if(!p.files)p.files=[];
  const files=Array.from(e.target.files);
  let pending=files.length;
  files.forEach(f=>{
    readFileEntry(f, p, entry=>{
      p.files.push(entry);
      pending--;
      if(pending===0){ save(); refreshFileList(p); }
    });
  });
  e.target.value='';
}

function handleDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag');
  const p=curPerf();if(!p)return;
  if(!p.files)p.files=[];
  const files=Array.from(e.dataTransfer.files);
  let pending=files.length;
  files.forEach(f=>{
    readFileEntry(f, p, entry=>{
      p.files.push(entry);
      pending--;
      if(pending===0){ save(); refreshFileList(p); }
    });
  });
}

function refreshFileList(p){
  const fl1=document.getElementById('sb-file-list');
  const fl2=document.getElementById('file-list-wrap');
  if(fl1)fl1.innerHTML=renderFiles(p);
  if(fl2)fl2.innerHTML=renderFiles(p);
}

function delFile(idx,e){
  e.stopPropagation();
  const p=curPerf();if(!p)return;
  // blob URL 해제
  const blobKey=`${p.id}_${idx}`;
  if(FILE_BLOBS[blobKey]){ URL.revokeObjectURL(FILE_BLOBS[blobKey]); delete FILE_BLOBS[blobKey]; }
  p.files.splice(idx,1);
  save();
  refreshFileList(p);
}

function openEditPerfFromDetail(){
  // detail 페이지에서 편집 모달 열기
  editingPerfId   = curPerfId;
  editingFromSubId = curSubId;
  editingFromGrade = curGrade;
  const p = curPerf(); if(!p) return;
  document.getElementById('ep-name').value = p.name;
  const typeEl=document.getElementById('ep-type');
  Array.from(typeEl.options).forEach((o,i)=>{if(o.value===p.type||o.text===p.type)typeEl.selectedIndex=i});
  const colorEl=document.getElementById('ep-color');
  Array.from(colorEl.options).forEach((o,i)=>{if(o.value===p.color)colorEl.selectedIndex=i});
  const subEl=document.getElementById('ep-subject');
  subEl.innerHTML=D.subjects.map(s=>`<option value="${s.id}" ${s.id===curSubId?'selected':''}>${s.icon} ${s.name}</option>`).join('');
  const gradeEl=document.getElementById('ep-grade');
  Array.from(gradeEl.options).forEach((o,i)=>{if(o.value===curGrade||o.text===curGrade)gradeEl.selectedIndex=i});
  openM('m-edit-perf');
}

// ── 수행평가 편집 ──
let editingPerfId = null;
let editingFromSubId = null;
let editingFromGrade = null;

function openEditPerf(perfId, e){
  e.stopPropagation();
  editingPerfId = perfId;
  editingFromSubId = curSubId;
  editingFromGrade = curGrade;

  const p = findPerf(curSubId, curGrade, perfId);
  if(!p) return;

  // 폼 채우기
  document.getElementById('ep-name').value = p.name;
  const typeEl = document.getElementById('ep-type');
  Array.from(typeEl.options).forEach((o,i)=>{ if(o.value===p.type||o.text===p.type) typeEl.selectedIndex=i; });
  const colorEl = document.getElementById('ep-color');
  Array.from(colorEl.options).forEach((o,i)=>{ if(o.value===p.color) colorEl.selectedIndex=i; });

  // 과목 목록 채우기
  const subEl = document.getElementById('ep-subject');
  subEl.innerHTML = D.subjects.map(s =>
    `<option value="${s.id}" ${s.id===curSubId?'selected':''}>${s.icon} ${s.name}</option>`
  ).join('');

  // 학년 선택
  const gradeEl = document.getElementById('ep-grade');
  Array.from(gradeEl.options).forEach((o,i)=>{ if(o.value===curGrade||o.text===curGrade) gradeEl.selectedIndex=i; });

  openM('m-edit-perf');
}

function doEditPerf(){
  if(!editingPerfId) return;
  const name  = document.getElementById('ep-name').value.trim();
  const type  = document.getElementById('ep-type').value;
  const color = document.getElementById('ep-color').value;
  const toSubId = document.getElementById('ep-subject').value;
  const toGrade = document.getElementById('ep-grade').value;
  if(!name){ alert('이름을 입력하세요.'); return; }

  const fromSub = findSub(editingFromSubId);
  const perfIdx = fromSub.grades[editingFromGrade].perfs.findIndex(p=>p.id===editingPerfId);
  if(perfIdx<0) return;

  const perf = fromSub.grades[editingFromGrade].perfs[perfIdx];
  perf.name  = name;
  perf.type  = type;
  perf.color = color;

  // 과목/학년 이동
  const moved = toSubId !== editingFromSubId || toGrade !== editingFromGrade;
  if(moved){
    fromSub.grades[editingFromGrade].perfs.splice(perfIdx, 1);
    const toSub = findSub(toSubId);
    if(!toSub.grades[toGrade]) toSub.grades[toGrade] = {perfs:[]};
    toSub.grades[toGrade].perfs.push(perf);
    // 현재 보기 위치 업데이트
    curSubId  = toSubId;
    curGrade  = toGrade;
  }

  save();
  closeM('m-edit-perf');

  // 이동했으면 해당 과목/학년 페이지로
  if(moved){
    renderSubjects();
    renderGrades();
    renderPerfs();
    goPage('perfs');
  } else {
    renderPerfs();
  }
}

// ── 파일 열기 (텍스트 파일 읽어서 섹션에 넣기) ──
function handleOpenFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const content = ev.target.result;
    const sec = curSec(); if(!sec) return;
    // 기존 내용에 추가할지 덮어쓸지 선택
    const action = confirm(`"${file.name}" 파일을 열겠습니다.\n\n확인: 현재 섹션에 내용 추가\n취소: 내용 덮어쓰기`);
    sec.content = action ? (sec.content ? sec.content + '\n\n---\n\n' + content : content) : content;
    save();
    const ed = document.getElementById('main-editor');
    if(ed) ed.innerText = sec.content;
    renderDetailSidebar();
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

// ── 섹션 이름 변경 ──
let renamingSecId = null;
function openRenameSec(secId){
  renamingSecId = secId;
  const sec = curPerf()?.sections.find(s=>s.id===secId);
  if(!sec) return;
  document.getElementById('rename-sec-input').value = sec.label;
  openM('m-rename-sec');
}
function doRenameSec(){
  const newLabel = document.getElementById('rename-sec-input').value.trim();
  if(!newLabel) return;
  const sec = curPerf()?.sections.find(s=>s.id===renamingSecId);
  if(!sec) return;
  // 아이콘도 자동 매핑
  const iconMap = {'개요':'📋','시대 환경':'🌏','멸종 가설':'🔬','핵심 데이터':'📊','에피소드':'🌍','출처':'📚','발표 대본':'🎤','결론':'✅','고찰':'💭','메모':'📌'};
  sec.icon = iconMap[newLabel] || sec.icon;
  sec.label = newLabel;
  save();
  closeM('m-rename-sec');
  renderDetail();
}

// ── 완성하기 (AI 문서 생성 — 채팅 형식) ──
let lastCompleteText = '';
let lastCompleteLabel = '';

function openCompleteModal(){
  document.getElementById('complete-status').style.display='none';
  document.getElementById('complete-result-area').style.display='none';
  document.getElementById('complete-save-btns').style.display='none';
  document.getElementById('complete-go-btn').disabled=false;
  document.getElementById('complete-go-btn').textContent='🤖 생성하기';
  document.getElementById('complete-msg').value='';
  lastCompleteText='';
  openM('m-complete');
  setTimeout(()=>document.getElementById('complete-msg').focus(),200);
}

function setCompleteMsg(msg){
  document.getElementById('complete-msg').value = msg;
  document.getElementById('complete-msg').focus();
}

async function doComplete(){
  const msg = document.getElementById('complete-msg').value.trim();
  const statusEl = document.getElementById('complete-status');
  const resultEl = document.getElementById('complete-result-area');
  const goBtn = document.getElementById('complete-go-btn');
  const saveBtns = document.getElementById('complete-save-btns');
  const p = curPerf(); const sub = findSub(curSubId);
  if(!p) return;
  if(!msg){ document.getElementById('complete-msg').focus(); return; }

  goBtn.disabled = true;
  goBtn.textContent = '생성 중...';
  statusEl.style.display = 'block';
  statusEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  resultEl.style.display = 'none';
  saveBtns.style.display = 'none';

  // 내용 있는 섹션만 수집 (비어있어도 OK)
  const allContent = p.sections
    .filter(s => s.content?.trim())
    .map(s => `[${s.label}]\n${s.content.trim()}`)
    .join('\n\n');

  // 라벨 자동 추출
  const labelMap = [
    ['대본','🎤','발표 대본'],['스크립트','🎤','발표 대본'],
    ['보고서','📄','완성 보고서'],['리포트','📄','완성 보고서'],
    ['요약','📝','핵심 요약'],['정리','📝','핵심 요약'],
    ['질문','❓','예상 Q&A'],['Q&A','❓','예상 Q&A'],
    ['PPT','🖼','PPT 구성안'],['슬라이드','🖼','PPT 구성안'],
  ];
  const matched = labelMap.find(([kw])=>msg.includes(kw));
  lastCompleteLabel = matched ? matched[2] : '생성 문서';
  const labelIcon = matched ? matched[1] : '📄';

  try {
    const systemPrompt = `너는 수행평가 문서를 완성해주는 전문가야.
과목: ${sub.icon}${sub.name}, 수행평가: "${p.name}"
아래는 지금까지 정리된 내용이야:

${allContent || '(내용 없음 — 창의적으로 작성해줘)'}

한국어로 작성하고, 마크다운 헤더(#, ##) 없이 깔끔하게 작성해. 내용만 바로 시작해.`;

    const text = await callAI(systemPrompt, msg);
    if(!text) throw new Error('빈 응답');
    lastCompleteText = text.trim();

    statusEl.style.display = 'none';
    resultEl.style.display = 'block';
    resultEl.textContent = lastCompleteText;
    saveBtns.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
    goBtn.disabled = false;
    goBtn.textContent = '🔄 다시 생성';
  } catch(err){
    statusEl.style.display = 'block';
    statusEl.innerHTML = `❌ 오류: ${err.message}`;
    goBtn.disabled = false;
    goBtn.textContent = '🤖 생성하기';
  }
}

function saveCompleteToSec(){
  if(!lastCompleteText) return;
  const p = curPerf(); if(!p) return;
  const iconMap = {'발표 대본':'🎤','완성 보고서':'📄','핵심 요약':'📝','예상 Q&A':'❓','PPT 구성안':'🖼','생성 문서':'📄'};
  let sec = p.sections.find(s=>s.label===lastCompleteLabel);
  if(!sec){
    sec = {id:'s_gen_'+Date.now(), icon:iconMap[lastCompleteLabel]||'📄', label:lastCompleteLabel, open:true, content:''};
    p.sections.push(sec);
  }
  sec.content = lastCompleteText;
  sec.open = true;
  curSecId = sec.id;
  save();
  closeM('m-complete');
  renderDetail();
}

function downloadCompleteFile(){
  if(!lastCompleteText) return;
  const p = curPerf(); const sub = findSub(curSubId);
  const filename = `${p?.name||'문서'}_${lastCompleteLabel}.txt`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lastCompleteText],{type:'text/plain;charset=utf-8'}));
  a.download = filename;
  a.click();
}


// ── 내보내기 ──
function exportAll(){
  let md='# 수행평가 노트\n\n';
  D.subjects.forEach(sub=>{
    md+=`# ${sub.icon} ${sub.name}\n\n`;
    GRADES.forEach(g=>{
      const perfs=sub.grades[g]?.perfs||[];
      if(perfs.length){
        md+=`## ${g}\n\n`;
        perfs.forEach(p=>{
          md+=`### ${p.name} (${p.type})\n`;
          if(p.score)md+=`**점수:** ${p.score}/${p.maxScore} | **등수:** ${p.rank||'미입력'}\n\n`;
          p.sections.forEach(s=>{if(s.content?.trim())md+=`#### ${s.label}\n\n${s.content.trim()}\n\n`});
        });
      }
    });
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));
  a.download='수행평가_노트.md';a.click();
}

// ── 모달 ──
function openM(id){document.getElementById(id).classList.add('open');setTimeout(()=>{const inp=document.querySelector(`#${id} input`);if(inp)inp.focus()},100)}
function closeM(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(o=>o.classList.remove('open'))});

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── 초기화 ──
initStorage();
</script>
